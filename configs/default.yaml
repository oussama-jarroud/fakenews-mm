# Global Hyperparameter Configuration (Section 10 & 13)
seed: 42
seeds: [42, 123, 999]
device: "cuda"

data:
  train_split: 0.70
  val_split: 0.15
  test_split: 0.15
  batch_size: 512
  dhash_size: 8
  hamming_max_dist: 4

model:
  text_dim: 512
  image_dim: 512
  hidden_dim: 256
  num_classes: 2
  dropout: 0.3

training:
  optimizer: "AdamW"
  lr: 0.001
  weight_decay: 0.01
  epochs: 8
