[project]
name = "fakenews-mm"
version = "0.1.0"
description = "Multimodal Fake News Detection: Consistency-aware detector for misleading image-text posts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "requests>=2.28.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.65.0",
    "scikit-learn>=1.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "httpx>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
